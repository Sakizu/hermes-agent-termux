name: build-deb

# Builds the Termux-native hermes-agent .deb for one upstream ref and
# publishes it as a GitHub release.
#
# Triggers:
#   - manually (Actions -> build-deb -> Run workflow), optional `ref` input:
#     an upstream tag like v2026.9.24 or a 40-hex commit. Empty means the
#     latest upstream release tag.
#   - daily at 04:00 UTC; scheduled runs skip when the newest upstream tag
#     already has a -termux release here.
#
# Secrets used: only the automatic GITHUB_TOKEN.
#
# Contract with scripts/build.sh (must exist in this repo):
#   bash scripts/build.sh --ref <tag-or-commit>
# The workflow exports DEB_VERSION (from scripts/deb_version.py) and
# HERMES_WORK; build.sh is expected to honor DEB_VERSION for the .deb
# filename, which 30-assemble.sh does:
#   $HERMES_WORK/hermes-agent_${DEB_VERSION}_aarch64.deb

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag (e.g. v2026.9.24) or commit SHA. Empty = latest upstream release."
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

env:
  UPSTREAM_REPO: NousResearch/hermes-agent

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip dpkg-dev git

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build helpers
        # NB: apt's python3-packaging lands in /usr/lib/python3/dist-packages,
        # visible only to /usr/bin/python3 — but setup-python prepends its
        # toolcache Python to PATH, so install into *that* interpreter.
        run: python3 -m pip install -q packaging

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve upstream ref
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            ref="${{ inputs.ref }}"
          else
            ref="$(curl -sSL "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Upstream ref: $ref"

      - name: Skip if already built (scheduled runs)
        id: skip
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${{ steps.ref.outputs.ref }}"
          if [[ "$ref" == v* ]]; then tagref="$ref"; else tagref="${ref:0:7}"; fi
          existing="$(gh api "repos/${{ github.repository }}/releases" --jq '.[].tag_name' 2>/dev/null || true)"
          if printf '%s\n' "$existing" | grep -q "^${tagref}-termux"; then
            echo "already built: ${tagref} already has a -termux release; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute deb version and release tag
        id: ver
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${{ steps.ref.outputs.ref }}"
          # Short tag: tags stay as-is, commits use short SHA (matches 1298c8e-termuxN style).
          if [[ "$ref" == v* ]]; then
            tagref="$ref"
          else
            tagref="${ref:0:7}"
          fi
          n=1
          while gh release view "${tagref}-termux${n}" --repo "${{ github.repository }}" >/dev/null 2>&1; do
            n=$((n + 1))
          done
          rtag="${tagref}-termux${n}"
          # Upstream release info for the title: "Hermes Agent Termux v0.21.5 (v2026.9.24)".
          # Tag builds use their own tag's release; commit builds use latest.
          if [[ "$ref" == v* ]]; then
            rel_json="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${ref}" 2>/dev/null || true)"
            debver="$(python3 scripts/deb_version.py "$ref" "$n")"
          else
            rel_json="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" 2>/dev/null || true)"
            base_ver="$(printf '%s' "$rel_json" | python3 -c 'import json,sys,re; m=re.search(r"v(\d+\.\d+\.\d+)", json.load(sys.stdin).get("name","")); print(m.group(1) if m else "")' 2>/dev/null || true)"
            if [ -n "$base_ver" ]; then
              debver="$(python3 scripts/deb_version.py "$ref" "$base_ver")"
            else
              debver="$(python3 scripts/deb_version.py "$ref")"
            fi
          fi
          up_name="$(printf '%s' "$rel_json" | python3 -c 'import json,sys,re; m=re.search(r"v(\d+\.\d+\.\d+)", json.load(sys.stdin).get("name","")); print("v"+m.group(1) if m else "")' 2>/dev/null || true)"
          up_tag="$(printf '%s' "$rel_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)"
          if [ -n "$up_name" ] && [ -n "$up_tag" ]; then
            rtitle="Hermes Agent Termux ${up_name} (${up_tag})"
          else
            rtitle="Hermes Agent Termux ${rtag}"
          fi
          echo "release_tag=$rtag" >> "$GITHUB_OUTPUT"
          echo "deb_version=$debver" >> "$GITHUB_OUTPUT"
          echo "release_title=$rtitle" >> "$GITHUB_OUTPUT"
          echo "Release tag: $rtag / deb version: $debver / title: $rtitle"

      - name: Cache toolchain (NDK, Termux libs)
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-work/toolchain
          # NDK version pinned; script hash catches toolchain changes.
          key: hermes-toolchain-ndk-r27c-${{ hashFiles('scripts/00-toolchain.sh', 'scripts/lib/build_env.sh') }}

      - name: Cache cargo (registry + target dir)
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hermes-work/cargo-home
            ${{ runner.temp }}/hermes-work/cargo-target
          # Upstream ref MUST be in the key: different commit = different sources.
          # Patches/scripts hash catches our own build changes.
          key: hermes-cargo-${{ steps.ref.outputs.ref }}-${{ hashFiles('patches/**', 'scripts/11-wheels-rust.sh', 'scripts/lib/env-rust.sh') }}

      - name: Build the .deb
        if: steps.skip.outputs.skip != 'true'
        env:
          DEB_VERSION: ${{ steps.ver.outputs.deb_version }}
          HERMES_WORK: ${{ runner.temp }}/hermes-work
        run: bash scripts/build.sh --ref "${{ steps.ref.outputs.ref }}"

      - name: Write checksums
        if: steps.skip.outputs.skip != 'true'
        run: |
          cd "${{ runner.temp }}/hermes-work"
          for deb in hermes-agent_*_aarch64.deb; do
            sha256sum "$deb" > "$deb.sha256"
            cat "$deb.sha256"
          done

      - name: Upload .deb artifact
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-deb
          path: |
            ${{ runner.temp }}/hermes-work/hermes-agent_*_aarch64.deb
            ${{ runner.temp }}/hermes-work/hermes-agent_*_aarch64.deb.sha256
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.release_title }}" \
            ${{ runner.temp }}/hermes-work/hermes-agent_*_aarch64.deb \
            ${{ runner.temp }}/hermes-work/hermes-agent_*_aarch64.deb.sha256
